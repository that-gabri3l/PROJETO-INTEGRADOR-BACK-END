<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Candidato - JobBoard</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Work+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
    --background: #FFFFFF;
    --foreground: #000000;
    --card: #FAFAFA;
    --primary: #000000;
    --secondary: #F4F4F5;
    --muted: #F4F4F5;
    --muted-foreground: #71717A;
    --accent: #2563EB;
    --border: #E4E4E7;
    --radius: 4px;
}

/* Modo Escuro (Inversão Elegante) */
/* Modo Escuro (Padrão Apple iOS/macOS) */
[data-theme="dark"] {
    --background: #000000;       /* Fundo preto absoluto */
    --foreground: #F5F5F7;       /* Texto off-white para leitura confortável */
    --card: #1C1C1E;             /* Cinza escuro para destacar as caixas do fundo */
    --primary: #0A84FF;          /* Azul vibrante para botões principais */
    --secondary: #2C2C2E;        /* Fundos secundários (hovers) */
    --muted: #2C2C2E;
    --muted-foreground: #98989D; /* Cinza claro correto para textos secundários */
    --accent: #30D158;           /* Verde vivo para alertas e links */
    --border: #38383A;           /* Bordas suaves */
}

/* Correção automática de contraste para os botões no Modo Escuro */
[data-theme="dark"] .btn-primary,
[data-theme="dark"] .nav-btn,
[data-theme="dark"] .candidate-side .btn-action {
    background-color: var(--primary) !important;
    color: #FFFFFF !important; 
}

[data-theme="dark"] .company-side .btn-action {
    background-color: var(--accent) !important;
    color: #000000 !important; 
}

/* Correção do hover na tela de escolha de cadastro */
[data-theme="dark"] .candidate-side:hover,
[data-theme="dark"] .company-side:hover {
    background-color: var(--secondary) !important;
}

/* Controle das Logos (Claro/Escuro) */
        .logo-dark {
            display: none;
        }

        /* Esconde a logo escura por padrão */
        .logo-light {
            display: block;
        }

        /* Mostra a logo clara por padrão */

        /* Quando o Modo Escuro for ativado: inverte a lógica */
        [data-theme="dark"] .logo-light {
            display: none !important;
        }

        [data-theme="dark"] .logo-dark {
            display: block !important;
        }

/* Estilo do botão de trocar tema */
.theme-toggle {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    padding: 8px;
    margin-left: 16px;
    border-radius: 50%;
    transition: background-color 0.2s;
}
.theme-toggle:hover {
    background-color: var(--secondary);
}

        * { box-sizing: border-box; }

        body {
            font-family: 'Work Sans', sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Navbar */
        .navbar {
            background-color: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar-logo {
            font-family: 'Fraunces', serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        /* Layout */
        .container {
            max-width: 640px;
            margin: 48px auto;
            padding: 0 24px;
        }

        /* Header */
        .btn-back {
            background: none; border: none; cursor: pointer;
            font-size: 13px; color: var(--muted-foreground);
            font-family: 'Work Sans', sans-serif; padding: 0; margin-bottom: 12px;
        }
        .eyebrow {
            font-family: 'JetBrains Mono', monospace; font-size: 10px;
            letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted-foreground);
        }
        .page-title {
            font-family: 'Fraunces', serif; font-size: 34px; font-weight: 600;
            margin: 8px 0 4px; letter-spacing: -0.5px;
        }

        /* Form Card */
        .form-card {
            background-color: var(--card);
            border: 1px solid var(--border);
            padding: 36px;
            margin-top: 36px;
        }

        /* Step Indicators */
        .step-container {
            display: flex; align-items: center; margin-bottom: 36px;
        }
        .step-item {
            display: flex; align-items: center; gap: 10px;
        }
        .step-circle {
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600;
            background-color: var(--muted); color: var(--muted-foreground);
            transition: all 0.2s;
        }
        .step-label {
            font-size: 12px; font-weight: 400; color: var(--muted-foreground);
        }
        .step-line {
            flex: 1; height: 1px; margin: 0 12px; background-color: var(--border);
        }
        /* Step Ativo */
        .step-active .step-circle { background-color: var(--primary); color: #F2EDE5; }
        .step-active .step-label { font-weight: 600; color: var(--foreground); }
        /* Step Completo */
        .step-done .step-circle { background-color: var(--accent); color: #F2EDE5; }
        .step-done-line { background-color: var(--accent); }

        /* Form Fields */
        .form-group { display: flex; flex-direction: column; gap: 18px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .form-label {
            display: block; font-size: 12px; font-weight: 600;
            color: var(--foreground); margin-bottom: 6px; letter-spacing: 0.02em;
        }
        .required { color: var(--accent); margin-left: 3px; }
        .form-input {
            width: 100%; padding: 10px 12px; border: 1px solid var(--border);
            border-radius: var(--radius); font-family: inherit; font-size: 14px;
            background-color: var(--background); color: var(--foreground); outline: none;
        }
        .form-input:focus { border-color: var(--primary); }
        textarea.form-input { resize: vertical; }

        /* File Upload */
        .upload-box {
            border: 1px dashed var(--border); padding: 20px; text-align: center;
            border-radius: var(--radius); cursor: pointer; background-color: var(--background);
            display: flex; align-items: center; justify-content: center; gap: 16px;
        }

        /* Checkbox tipo botão (Regime) */
        .btn-checkbox {
            padding: 8px 16px; border: 1px solid var(--border);
            background-color: transparent; color: var(--foreground);
            font-family: inherit; font-size: 13px; font-weight: 500;
            cursor: pointer; border-radius: var(--radius);
        }
        .btn-checkbox.active {
            background-color: var(--primary); color: #F2EDE5; border-color: var(--primary);
        }

        /* Ações (Botões de Continuar/Voltar) */
        .form-actions {
            display: flex; justify-content: space-between; align-items: center; margin-top: 28px;
        }
        .btn-primary {
            padding: 12px 28px; background-color: var(--primary); color: #F2EDE5;
            border: none; font-family: inherit; font-size: 14px; font-weight: 600;
            border-radius: var(--radius); cursor: pointer; margin-left: auto;
        }
        .btn-secondary {
            background: none; border: 1px solid var(--border); padding: 10px 20px;
            cursor: pointer; font-family: inherit; font-size: 13px; border-radius: var(--radius);
        }

        /* Lógica de Visibilidade dos Passos */
        .step-content { display: none; }
        .step-content.active { display: block; }

    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="navbar-logo"><!-- Imagem para o Modo Claro -->
            <img src="logo-claro-infodin.png" alt="Logo do site" class="logo-light"
                style="height:40px; width: auto; object-fit: contain;">

            <!-- Imagem para o Modo Escuro -->
            <img src="logo-infodin.png" alt="Logo do site" class="logo-dark"
                style="height: 40px; width: auto; object-fit: contain;"></a>
        <button id="theme-toggle" class="theme-toggle" title="Mudar tema">🌗</button>
    </nav>

    <div class="container">
        <!-- Header -->
        <div style="margin-bottom: 36px;">
            <button class="btn-back">← Voltar</button>
            <div class="eyebrow">Cadastro de candidato</div>
            <h1 class="page-title">Crie seu perfil</h1>
            <p style="font-size: 14px; color: var(--muted-foreground); margin: 0;">
                Gratuito. Encontre vagas e candidate-se em segundos.
            </p>
        </div>

        <!-- Indicador de Passos -->
        <div class="step-container">
            <div class="step-item step-active" id="indicator-1">
                <div class="step-circle">1</div>
                <div class="step-label">Dados pessoais</div>
            </div>
            <div class="step-line" id="line-1"></div>
            
            <div class="step-item" id="indicator-2">
                <div class="step-circle">2</div>
                <div class="step-label">Perfil profissional</div>
            </div>
            <div class="step-line" id="line-2"></div>
            
            <div class="step-item" id="indicator-3">
                <div class="step-circle">3</div>
                <div class="step-label">Acesso e senha</div>
            </div>
        </div>

        <!-- Formulário (Tudo em um único form para enviar via POST) -->
        <div class="form-card">
            <!-- Aponte o action para a sua rota do back-end -->
            <form id="registerForm" action="/api/candidatos" method="POST">
                
                <!-- PASSO 1 -->
                <div class="step-content active" id="step-1">
                    <div class="form-group">
                        <div>
                            <label class="form-label">Nome completo<span class="required">*</span></label>
                            <input type="text" name="nome" class="form-input" placeholder="Ex: Maria Silva" required>
                        </div>
                        <div class="grid-2">
                            <div>
                                <label class="form-label">E-mail<span class="required">*</span></label>
                                <input type="email" name="email" class="form-input" placeholder="maria@email.com" required>
                            </div>
                            <div>
                                <label class="form-label">Telefone</label>
                                <input type="text" name="telefone" class="form-input" placeholder="(11) 99999-9999">
                            </div>
                        </div>
                        <div class="grid-2">
                            <div>
                                <label class="form-label">Cidade<span class="required">*</span></label>
                                <input type="text" name="cidade" class="form-input" placeholder="São Paulo, SP" required>
                            </div>
                            <div>
                                <label class="form-label">Data de nascimento</label>
                                <input type="date" name="data_nascimento" class="form-input">
                            </div>
                        </div>
                        <div>
                            <label class="form-label">Foto de perfil</label>
                            <div class="upload-box">
                                <div style="font-size: 24px;">👤</div>
                                <div style="text-align: left;">
                                    <div style="font-size: 13px; font-weight: 500;">Clique para fazer upload</div>
                                    <div style="font-size: 11px; color: var(--muted-foreground);">JPG ou PNG · Máximo 2 MB</div>
                                </div>
                                <input type="file" name="foto" style="display:none;">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- PASSO 2 -->
                <div class="step-content" id="step-2">
                    <div class="form-group">
                        <div class="grid-2">
                            <div>
                                <label class="form-label">Cargo atual / desejado<span class="required">*</span></label>
                                <input type="text" name="cargo" class="form-input" placeholder="Ex: Desenvolvedora Frontend" required>
                            </div>
                            <div>
                                <label class="form-label">Área de atuação<span class="required">*</span></label>
                                <select name="area" class="form-input" required>
                                    <option value="">Selecione...</option>
                                    <option value="Tecnologia">Tecnologia</option>
                                    <option value="Design">Design</option>
                                    <option value="Marketing">Marketing</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid-2">
                            <div>
                                <label class="form-label">Nível de experiência<span class="required">*</span></label>
                                <select name="experiencia" class="form-input" required>
                                    <option value="">Selecione...</option>
                                    <option value="Estagiário">Estagiário</option>
                                    <option value="Júnior">Júnior (0–2 anos)</option>
                                    <option value="Pleno">Pleno (2–5 anos)</option>
                                    <option value="Sênior">Sênior (5+ anos)</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">Escolaridade</label>
                                <select name="escolaridade" class="form-input">
                                    <option value="">Selecione...</option>
                                    <option value="Ensino médio">Ensino médio</option>
                                    <option value="Graduação">Graduação completa</option>
                                    <option value="Pós-graduação">Pós-graduação / MBA</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="form-label">Regime de trabalho preferido</label>
                            <div style="display: flex; gap: 8px;" id="regime-buttons">
                                <button type="button" class="btn-checkbox" onclick="toggleRegime(this, 'Presencial')">Presencial</button>
                                <button type="button" class="btn-checkbox" onclick="toggleRegime(this, 'Híbrido')">Híbrido</button>
                                <button type="button" class="btn-checkbox" onclick="toggleRegime(this, 'Remoto')">Remoto</button>
                            </div>
                            <!-- Campo oculto que enviará os dados selecionados pro Back-End -->
                            <input type="hidden" name="regime_preferido" id="regime_input" value="">
                        </div>

                        <div>
                            <label class="form-label">LinkedIn</label>
                            <input type="url" name="linkedin" class="form-input" placeholder="linkedin.com/in/maria-silva">
                        </div>

                        <div>
                            <label class="form-label">Sobre você</label>
                            <textarea name="sobre" class="form-input" rows="4" placeholder="Escreva um breve resumo profissional..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- PASSO 3 -->
                <div class="step-content" id="step-3">
                    <div class="form-group">
                        <div style="padding: 14px 16px; background-color: var(--secondary); border: 1px solid var(--border); display: flex; gap: 12px; border-radius: 2px;">
                            <span style="font-size: 18px;">🔒</span>
                            <p style="margin: 0; font-size: 13px; line-height: 1.5;">Crie uma senha segura para acessar seu perfil.</p>
                        </div>

                        <div>
                            <label class="form-label">Senha<span class="required">*</span></label>
                            <input type="password" name="senha" class="form-input" placeholder="Mínimo 8 caracteres" required>
                        </div>
                        <div>
                            <label class="form-label">Confirmar senha<span class="required">*</span></label>
                            <input type="password" name="confirmar_senha" class="form-input" placeholder="Repita a senha" required>
                        </div>

                        <!-- Checkbox customizado -->
                        <label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--border); cursor: pointer;">
                            <input type="checkbox" name="notificacoes" value="sim" checked style="width: 18px; height: 18px;">
                            <div>
                                <div style="font-size: 13px; font-weight: 500;">Receber alertas de vagas por e-mail</div>
                                <div style="font-size: 12px; color: var(--muted-foreground);">Notificações quando surgirem vagas compatíveis com seu perfil</div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Botoes de Navegação do Formulário -->
                <div class="form-actions">
                    <button type="button" id="btnPrev" class="btn-secondary" style="display: none;" onclick="changeStep(-1)">← Voltar</button>
                    <button type="button" id="btnNext" class="btn-primary" onclick="changeStep(1)">Continuar →</button>
                    <button type="submit" id="btnSubmit" class="btn-primary" style="display: none;">Criar meu perfil</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Simples para Alternar os Passos -->
    <script>
        let currentStep = 1;
        const totalSteps = 3;

        function changeStep(direction) {
            // Esconde o passo atual
            document.getElementById(`step-${currentStep}`).classList.remove('active');
            
            // Atualiza o indicador (marcar como concluído se estiver avançando)
            if(direction === 1) {
                document.getElementById(`indicator-${currentStep}`).classList.remove('step-active');
                document.getElementById(`indicator-${currentStep}`).classList.add('step-done');
                document.getElementById(`indicator-${currentStep}`).querySelector('.step-circle').innerHTML = '✓';
                if(currentStep < totalSteps) document.getElementById(`line-${currentStep}`).classList.add('step-done-line');
            } else {
                // Se estiver voltando, remove o visual de concluído do passo que estamos saindo
                document.getElementById(`indicator-${currentStep}`).classList.remove('step-active');
                document.getElementById(`indicator-${currentStep}`).classList.remove('step-done');
                document.getElementById(`indicator-${currentStep}`).querySelector('.step-circle').innerHTML = currentStep;
                if(currentStep > 1) document.getElementById(`line-${currentStep-1}`).classList.remove('step-done-line');
            }

            // Atualiza o contador do passo
            currentStep += direction;

            // Mostra o novo passo
            document.getElementById(`step-${currentStep}`).classList.add('active');
            
            // Atualiza visual do indicador do novo passo
            document.getElementById(`indicator-${currentStep}`).classList.remove('step-done');
            document.getElementById(`indicator-${currentStep}`).classList.add('step-active');
            document.getElementById(`indicator-${currentStep}`).querySelector('.step-circle').innerHTML = currentStep;

            // Controla a visibilidade dos botões
            document.getElementById('btnPrev').style.display = (currentStep === 1) ? 'none' : 'block';
            
            if (currentStep === totalSteps) {
                document.getElementById('btnNext').style.display = 'none';
                document.getElementById('btnSubmit').style.display = 'block';
            } else {
                document.getElementById('btnNext').style.display = 'block';
                document.getElementById('btnSubmit').style.display = 'none';
            }
        }

        // Script para gerenciar os botões de Regime de Trabalho
        let regimesSelecionados = [];
        function toggleRegime(btnElement, valor) {
            btnElement.classList.toggle('active');
            
            if(regimesSelecionados.includes(valor)) {
                regimesSelecionados = regimesSelecionados.filter(item => item !== valor);
            } else {
                regimesSelecionados.push(valor);
            }
            
            // Salva no input escondido para enviar pro Back-End (ex: "Presencial,Remoto")
            document.getElementById('regime_input').value = regimesSelecionados.join(',');
        }
    </script>
    <script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    const htmlElement = document.documentElement;

    // Verifica se o usuário já tinha escolhido o tema escuro antes
    if (localStorage.getItem('theme') === 'dark') {
        htmlElement.setAttribute('data-theme', 'dark');
    }

    // Função do clique
    themeToggleBtn.addEventListener('click', () => {
        if (htmlElement.getAttribute('data-theme') === 'dark') {
            htmlElement.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
        } else {
            htmlElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        }
    });
</script>
</body>
</html>
